name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every master commit get its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      clients: ${{ steps.clients.outputs.changes }}
      server: ${{ steps.server.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Filter names are directory names; the matrix below runs in each one.
      - id: clients
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            customer-facing-client:
              - 'customer-facing-client/**'
              - '.github/workflows/ci.yml'
            admin-panel-client:
              - 'admin-panel-client/**'
              - '.github/workflows/ci.yml'

      - id: server
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  clients:
    needs: changes
    if: needs.changes.outputs.clients != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.clients) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

      # Catches uncommitted generated files (e.g. routeTree.gen.ts).
      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            git diff -- .
            exit 1
          fi

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both paths must be explicit: the defaults look at the repo root.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: go mod tidy -diff

      - run: go vet ./...

      - run: go test -race ./...

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The only required status check in branch protection. Skipped jobs count
  # as passing, so path-filtered PRs never hang on a missing check.
  ci-ok:
    needs: [changes, clients, server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
